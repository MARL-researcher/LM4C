# --- vffac specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000

# parallel runner
runner: "t2mac_parallel"
batch_size_run: 8
buffer_size: 5000
batch_size: 32

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
agent_output_type: "q"
#l earner: "q_learner"
double_q: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64
comm_coef: 0.05
min_uncer: 0.1

n_value: 64
n_key: 64
n_query: 64
run: "t2mac_run"
mac: "t2mac_mac"
agent: "t2mac"
lambda_entropy: 0.0
learner: "t2mac_learner"

name: "t2mac"
