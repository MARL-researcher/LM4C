# --- TGCNet specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0

runner: "tgcnet_parallel"
batch_size_run: 8
buffer_size: 5000
batch_size: 32

# update the target network every {} episodes
target_update_interval_or_tau: 200

obs_individual_obs: False

# use the TGC_Learner to train
run: "tgcnet_run"
mac: "tgcnet_mac"
agent: "tgcnet"
agent_output_type: "q"
learner: "tgc_learner"
double_q: True
mixer: "coarsen"
use_rnn: True
hidden_dim: 128

# parameters of the graph coarsening
coarsening_embed_dim: 32
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

# parameters of the transformer agent
enc_att_heads: 2
dec_att_heads: 4
att_enc_dim: 128
att_dec_dim: 32
num_layers: 2
dropout: 0

name: "tgcnet"
