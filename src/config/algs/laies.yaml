# --- LAIES parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000 # 500000 for 6h_vs_8z epsilon_anneal_time=500000

runner: "laies_parallel"
batch_size_run: 8 # batch_size_run=4, buffer_size = 2500, batch_size=64  for 3s5z_vs_3s6z
buffer_size: 5000 
batch_size: 32
optimizer: 'adam'

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
mac: "laies_mac"
agent: "laies"
agent_output_type: q

run: "laies_run"

learner: "laies_learner"
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001 # Learning rate for agents
td_lambda: 0.6 # 0.3 for 6h_vs_8z 0.6 td_lambda=0.3
q_lambda: False

# rnn layer normalization
use_layer_norm: False

# orthogonal init for DNN
use_orthogonal: False
gain: 0.01

# Priority experience replay
use_per: False
per_alpha: 0.6
per_beta: 0.4
return_priority: False
predict_epoch: 25
enemy_sample: 4

anneal_intrin: Ture
anneal_speed: 2000000
i_one_clip: 0.002
sample_size: 16
cuda_save: True
itrin_two_clip: 1
enemy_shape: 3  # 4 for pp and 3 for smac
beta1: 100
beta2: 0.2

name: "laies"